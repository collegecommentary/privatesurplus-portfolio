<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>v6 check</title>
<style>
  html,body{margin:0;padding:0;background:#222;}
  iframe{border:0;display:block;background:#fff;}
  #w{color:#fff;font:12px/1.4 monospace;padding:4px 6px;}
</style>
</head>
<body>
<div id="w">v6check</div>
<script>
  var p = new URLSearchParams(location.search);
  var w = parseInt(p.get('w') || '1440', 10);
  var h = parseInt(p.get('h') || '4000', 10);
  var hash = p.get('h2') || '';
  var y = parseInt(p.get('y') || '0', 10);
  var f = document.createElement('iframe');
  f.width = w; f.height = h;
  f.style.marginTop = (-y) + 'px';
  f.src = '/' + (hash ? '#' + hash : '');
  document.getElementById('w').textContent = 'v6check ' + w + 'x' + h + ' ' + hash + ' y' + y;
  document.body.appendChild(f);
</script>
</body>
</html>
